<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TastyCup - My Profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <!-- The profile needs a signed-in account. Redirect before anything shows. -->
    <script>
        (function () {
            var user = null;
            try { user = JSON.parse(localStorage.getItem("tastyCupUser")); } catch (e) {}
            if (!user) {
                window.location.replace("menu.html?loginRequired=true");
            }
        })();
    </script>
</head>
<body data-requires-auth="true">

    <!-- HEADER -->
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="brand">☕ TastyCup</a>

            <nav class="main-nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="menu.html" class="nav-link">Menu</a>
                <a href="cart.html" class="nav-link">Cart</a>
                <a href="profile.html" class="nav-link active">Profile</a>
            </nav>

            <button type="button" class="account-btn" id="accountBtn">
                Sign In
            </button>
        </div>
    </header>

    <main class="profile-page">

        <section class="profile-card">
            <div class="profile-avatar">👤</div>
            <div class="profile-info">
                <p class="eyebrow">MY PROFILE</p>
                <h1 id="profileName">Your Name</h1>
                <p id="profileEmail"></p>
            </div>
            <div class="profile-stats">
                <div><strong id="profileOrderCount">0</strong><span>Orders</span></div>
                <div><strong id="profileTotalSpent">₱0.00</strong><span>Spent</span></div>
            </div>
        </section>

        <section class="profile-orders">
            <h2>My Orders</h2>
            <p class="profile-hint">
                You can cancel an order only while it is a New Order. Once the cafe starts preparing it, it can no longer be cancelled.
            </p>

            <div id="profileOrders" class="profile-order-list">
                <!-- Generated by js/profile.js -->
            </div>
        </section>

    </main>

    <!-- ACCOUNT / SIGN-IN MODAL (shown if you sign out and stay) -->
    <div class="overlay" id="accountOverlay" aria-hidden="true">
        <div class="account-modal" role="dialog" aria-modal="true"
             aria-labelledby="accountTitle">

            <button type="button" class="modal-close" id="closeAccount"
                    aria-label="Close sign-in">×</button>

            <h2 id="accountTitle">Welcome to TastyCup</h2>
            <p class="modal-subtitle" id="accountDescription">Sign in to your account.</p>

            <form id="signInForm">
                <div class="form-group">
                    <label for="accountEmail">Email</label>
                    <input type="email" id="accountEmail" placeholder="you@example.com"
                           autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="accountPassword">Password</label>
                    <input type="password" id="accountPassword" placeholder="Password"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="primary-btn" id="accountSubmit">Sign In</button>
            </form>

            <p class="signup-login">
                Don't have an account? <a href="signup.html">Create Account</a>
            </p>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/core.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
