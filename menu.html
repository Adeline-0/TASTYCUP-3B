
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TastyCup - Menu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="nav-container">

            <a href="index.html" class="brand">
                ☕ TastyCup
            </a>

            <nav class="main-nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="menu.html" class="nav-link active">Menu</a>
                <a href="cart.html" class="nav-link">Cart</a>
                <a href="profile.html" class="nav-link">Profile</a>
            </nav>

            <button type="button" class="account-btn" id="accountBtn">
                Sign In
            </button>

        </div>
    </header>


    <!-- MENU -->
    <main class="menu-page">

        <div class="page-heading">
            <p class="eyebrow">Freshly made for you</p>

            <h1>Our Menu</h1>

            <p>
                Pick your favorite drinks, food, and desserts.
            </p>
        </div>


        <!-- CATEGORY BUTTONS -->
        <div class="category-tabs">

            <button
                type="button"
                class="category-tab active"
                data-category="all"
            >
                All
            </button>

            <button
                type="button"
                class="category-tab"
                data-category="drinks"
            >
                Drinks
            </button>

            <button
                type="button"
                class="category-tab"
                data-category="foods"
            >
                Foods
            </button>

            <button
                type="button"
                class="category-tab"
                data-category="desserts"
            >
                Desserts
            </button>

        </div>


        <!-- PRODUCTS -->
        <section class="menu-grid" id="menuGrid">
            <!-- Products are generated by js/menu.js -->
        </section>

    </main>


    <!-- PRODUCT DETAILS MODAL -->
    <div class="overlay" id="productOverlay">

        <div class="product-modal" role="dialog" aria-modal="true"
             aria-labelledby="productModalName">

            <button
                type="button"
                class="modal-close"
                id="closeProduct"
                aria-label="Close product details"
            >
                ×
            </button>

            <div class="product-modal-image" id="productModalImage">
                ☕
            </div>

            <div class="product-modal-info">

                <p class="eyebrow" id="productModalCategory">
                    Drink
                </p>

                <h2 id="productModalName">
                    Product Name
                </h2>

                <p id="productModalDescription">
                    Product description.
                </p>

                <h3 id="productModalPrice">
                    ₱0.00
                </h3>


                <!-- DRINK OPTIONS -->
                <div id="drinkOptions" class="product-options">

                    <div class="option-group">

                        <label>Size</label>

                        <div class="option-buttons">

                            <button
                                type="button"
                                class="option-btn active"
                                data-size="16oz"
                            >
                                16oz
                            </button>

                            <button
                                type="button"
                                class="option-btn"
                                data-size="22oz"
                            >
                                22oz +₱25
                            </button>

                        </div>

                    </div>

                    <div class="option-group">

                        <label>Sweetness</label>

                        <div class="option-buttons">

                            <button
                                type="button"
                                class="option-btn"
                                data-sweetness="25%"
                            >
                                25%
                            </button>

                            <button
                                type="button"
                                class="option-btn active"
                                data-sweetness="50%"
                            >
                                50%
                            </button>

                            <button
                                type="button"
                                class="option-btn"
                                data-sweetness="75%"
                            >
                                75%
                            </button>

                            <button
                                type="button"
                                class="option-btn"
                                data-sweetness="100%"
                            >
                                100%
                            </button>

                        </div>

                    </div>

                </div>


                <!-- QUANTITY -->
                <div class="quantity-row">

                    <label>Quantity</label>

                    <div class="quantity-controls">

                        <button
                            type="button"
                            id="qtyMinus"
                            aria-label="Decrease quantity"
                        >
                            −
                        </button>

                        <span id="qtyValue">1</span>

                        <button
                            type="button"
                            id="qtyPlus"
                            aria-label="Increase quantity"
                        >
                            +
                        </button>

                    </div>

                </div>


                <button
                    type="button"
                    class="primary-btn"
                    id="addToCartBtn"
                >
                    Add to Cart
                </button>

            </div>

        </div>

    </div>


    <!-- ACCOUNT / SIGN-IN MODAL -->
    <div class="overlay" id="accountOverlay">

        <div class="account-modal" role="dialog" aria-modal="true"
             aria-labelledby="accountModalTitle">

            <button
                type="button"
                class="modal-close"
                id="closeAccount"
                aria-label="Close sign-in"
            >
                ×
            </button>

            <h2 id="accountModalTitle">Welcome to TastyCup</h2>

            <p>Sign in to your account.</p>

            <form id="signInForm">

                <div class="form-group">

                    <label for="signInEmail">Email</label>

                    <input
                        type="email"
                        id="signInEmail"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="signInPassword">Password</label>

                    <input
                        type="password"
                        id="signInPassword"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <p
                    id="signInMessage"
                    class="signup-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button type="submit" class="primary-btn">
                    Sign In
                </button>

            </form>

            <p class="signup-login">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </div>


    <!-- TOAST -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>


    <!-- MAIN JAVASCRIPT -->
    <script src="js/core.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
    <script src="js/menu.js"></script>

</body>
</html>
